version: 2

models:
  - name: stg_raw_iot_data
    description: "Staging model for cleaned IoT shipment data"

    columns:
      - name: Record_ID
        tests:
          - unique
          - not_null

      - name: Shipment_ID
        tests:
          - not_null

      - name: Product_Name
        tests:
          - not_null

  - name: cleaned_iot_data
    description: "Analytics ready IoT shipment data"

    columns:
      - name: Record_ID
        tests:
          - unique
          - not_null



  - name: spoilage_arbitrage_model
    description: "Analytics model for spoilage arbitrage reporting"

    columns:
      - name: RECORD_ID
        description: "Unique identifier for each shipment"

      - name: ARBITRAGE_PROFIT
        description: "Estimated profit after spoilage loss"

      - name: TRANSPORT_PRIORITY
        description: "Recommended transport priority"

      - name: ARBITRAGE_OPPORTUNITY
        description: "Arbitrage opportunity level"